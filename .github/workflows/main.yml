name: Build VideoRenderer

on:
  push:
    paths-ignore:
      - .github/workflows/main.yml
      - '**.txt'
      - '**.md'
      - '**.cmd'
      - '**.vcxproj.filters'
  pull_request:
    paths-ignore:
      - .github/workflows/main.yml      
      - '**.txt'
      - '**.md'
      - '**.cmd'
      - '**.vcxproj.filters'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build VideoRenderer
        run: |
          .\\build_mpcvr.cmd NoWait
        shell: pwsh
        continue-on-error: true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "MpcVideoRenderer-OFI"
          path: |
            _bin/Filter_x64/*.ax
            _bin/Filter_x86/*.ax
            _bin/*.zip
            _bin/logs/**
          compression-level: 0
